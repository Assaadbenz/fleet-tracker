services:
  postgres:
    image: postgres:16-alpine
    container_name: fleet_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleet_db}
      POSTGRES_USER: ${POSTGRES_USER:-fleet_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleet_secret_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleet_admin} -d ${POSTGRES_DB:-fleet_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fleet_network

  redis:
    image: redis:7-alpine
    container_name: fleet_redis
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
               redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes;
             else
               redis-server --appendonly yes;
             fi"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fleet_redis_secret}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: >
        sh -c "if [ -n \"$${REDIS_PASSWORD}\" ]; then
                 redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG;
               else
                 redis-cli ping | grep PONG;
               fi"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fleet_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  fleet_network:
    driver: bridge
